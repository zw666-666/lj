services:
  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: lj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lj_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lvjing}
      MYSQL_USER: ${MYSQL_USER:-lvjing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lvjing_pass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: lj-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lj_redis_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: lj-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: lj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lvjing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lvjing_mq_2024}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/0
      - ES_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-lvjing}:${RABBITMQ_PASS:-lvjing_mq_2024}@rabbitmq:5672//
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      # DeepSeek AI
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # 支付宝
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_SANDBOX=${ALIPAY_SANDBOX:-true}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL:-}
      - ALIPAY_RETURN_URL=${ALIPAY_RETURN_URL:-}
      - ALIPAY_CALLBACK_URL=${ALIPAY_CALLBACK_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://120.27.143.225}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://120.27.143.225}
      # 短信
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SMS_ALIYUN_ACCESS_KEY_ID=${SMS_ALIYUN_ACCESS_KEY_ID:-}
      - SMS_ALIYUN_ACCESS_KEY_SECRET=${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      - SMS_ALIYUN_SIGN_NAME=${SMS_ALIYUN_SIGN_NAME:-}
      - SMS_ALIYUN_TEMPLATE_CODE=${SMS_ALIYUN_TEMPLATE_CODE:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ========== Celery Worker ==========
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-celery-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/1
      - ES_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-lvjing}:${RABBITMQ_PASS:-lvjing_mq_2024}@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  # ========== Celery Beat (定时任务) ==========
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-celery-beat
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # ========== Vue 前端 (Nginx 生产构建) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:
