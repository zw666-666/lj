version: "3.9"

services:
  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: lj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lj_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lvjing}
      MYSQL_USER: ${MYSQL_USER:-lvjing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lvjing_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存与 Session ==========
  redis:
    image: redis:7-alpine
    container_name: lj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lj_redis_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: lj-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: lj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lvjing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lvjing_mq_2024}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/0
      - ES_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-lvjing}:${RABBITMQ_PASS:-lvjing_mq_2024}@rabbitmq:5672//
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ========== Celery Worker ==========
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-celery-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/1
      - ES_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-lvjing}:${RABBITMQ_PASS:-lvjing_mq_2024}@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  # ========== Celery Beat (定时任务) ==========
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lj-celery-beat
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-lvjing}:${MYSQL_PASSWORD:-lvjing_pass}@mysql:3306/${MYSQL_DATABASE:-lvjing}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lj_redis_2024}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # ========== Vue3 前端 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lj-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: lj-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:
